name: Blog 9時枠（ハーネス）

on:
  schedule:
    # 01:00 UTC = 09:00 Asia/Kuala_Lumpur (UTC+8, no DST).
    # Runs alongside the daily digest (same cron) — the digest and the blog
    # use separate concurrency groups, so both complete.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-0900
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Write one blog post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.OPENAI_COMPATIBLE_BASE_URL }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          OPENAI_COMPATIBLE_MODEL: ${{ secrets.OPENAI_COMPATIBLE_MODEL }}
        run: node scripts/blog/generate.mjs --slot 0900

      - name: Commit the post
        env:
          SECURITY_INPUT_1: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/blog memory
          if git diff --cached --quiet; then
            echo "変更なし: コミットをスキップします"
            exit 0
          fi
          git commit -m "blog(0900): $(TZ=Asia/Kuala_Lumpur date '+%Y-%m-%d')"
          for attempt in 1 2 3; do
            if git push origin HEAD:${SECURITY_INPUT_1}; then
              exit 0
            fi
            echo "push に失敗しました。rebase して再試行します ($attempt/3)"
            git pull --rebase origin ${SECURITY_INPUT_1} || true
            sleep $((attempt * 5))
          done
          exit 1
