name: CI

on:
  push:
    branches-ignore: []
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline checks
        run: node scripts/selftest.mjs
      - name: Portable brief tests
        run: node --test scripts/export-brief.test.mjs
      - name: Test knowledge shard builder
        run: node --test scripts/build-kb.test.mjs
      - name: Build knowledge shards from the real archive
        run: node scripts/build-kb.mjs
      - name: Regenerate the PWA bundle
        run: node scripts/pack.mjs
