name: CI

on:
  push:
    branches-ignore: []
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline checks
        run: node scripts/selftest.mjs
      - name: Portable brief tests
        run: node --test scripts/export-brief.test.mjs
      - name: Test knowledge shard builder
        run: node --test scripts/build-kb.test.mjs
      - name: Test EDU wiki index contract
        run: node --test scripts/sync-edu-wiki.test.mjs
      - name: Build knowledge shards from the real archive
        run: node scripts/build-kb.mjs
      - name: Validate Hyperfleet tool inventory and unverified statuses
        run: |
          node scripts/validate-hyperfleet-catalog.mjs
          node --test scripts/validate-hyperfleet-catalog.test.mjs
          node --test scripts/hyperfleet-free-stack.test.mjs
          node scripts/hyperfleet-free-stack.mjs --repo infocollect
      - name: Offline Python SQLite FTS5 tests and live KB index
        run: |
          python3 scripts/test_kb_fts.py
          python3 scripts/kb-fts.py --db "$RUNNER_TEMP/infocollect-kb.sqlite" build
          python3 scripts/kb-fts.py --db "$RUNNER_TEMP/infocollect-kb.sqlite" search "AI" --limit 3
      - name: Regenerate the PWA bundle
        run: node scripts/pack.mjs
