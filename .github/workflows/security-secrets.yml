name: Secret history scan
on:
  pull_request:
  push:
    branches: ["claude/github-ai-tools-pwa-77pbbx"]
  schedule:
    - cron: '52 4 * * 6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.4'
          cache: false
      - name: Build pinned scanner outside the repository
        working-directory: ${{ runner.temp }}
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
          GOFLAGS: ''
        run: go install github.com/zricethezav/gitleaks/v8@6eaad039603a4de39fddd1cf5f727391efe9974e
      - name: Scan fetched history (redacted)
        env:
          6eaad039603a4de39fddd1cf5f727391efe9974e_CONFIG: ''
          6eaad039603a4de39fddd1cf5f727391efe9974e_CONFIG_TOML: ''
        run: |
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/security-gitleaks.toml"
          touch "$RUNNER_TEMP/security-gitleaks.ignore"
          rm -f .gitleaksignore
          "$(go env GOPATH)/bin/gitleaks" git . --log-opts="--all" --redact=100 --no-banner --ignore-gitleaks-allow --config="$RUNNER_TEMP/security-gitleaks.toml" --gitleaks-ignore-path="$RUNNER_TEMP/security-gitleaks.ignore"
